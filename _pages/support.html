---
permalink: /support/
title: Support
layout: default
---

<style>
  form {
    max-width: 500px;
    margin: 20px auto;
    padding: 15px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-family: Arial, sans-serif;
  }
  label {
    display: block;
    margin-bottom: 10px;
  }
  input[type="text"],
  input[type="email"],
  textarea,
  input[type="file"] {
    width: 100%;
    padding: 8px;
    margin-top: 4px;
    box-sizing: border-box;
  }
  button {
    padding: 10px 20px;
    cursor: pointer;
    background-color: #0078d4;
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 16px;
  }
  button:hover {
    background-color: #005ea1;
  }
  #responseMsg {
    margin-top: 15px;
    font-weight: bold;
  }
</style>

<h1>Support Form</h1>

<form
  id="supportForm"
  action="https://support-backend-jeh0.onrender.com/api/support"
  method="POST"
  enctype="multipart/form-data"
>
  <label>
    Name:
    <input type="text" name="name" required />
  </label>

  <label>
    Email:
    <input type="email" name="email" required />
  </label>

  <label>
    Message:
    <textarea name="message" rows="5" required></textarea>
  </label>

  <label>
    Attachment (optional):
    <input type="file" name="attachment" />
  </label>

  <button type="submit">Submit Support Request</button>

  <p id="responseMsg"></p>
</form>

<script>
  const form = document.getElementById('supportForm');
  const msg = document.getElementById('responseMsg');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.textContent = 'Sending...';

    const formData = new FormData(form);

    try {
      const response = await fetch(form.action, {
        method: 'POST',
        body: formData,
      });

      const result = await response.json();

      if (response.ok) {
        msg.style.color = 'green';
        msg.textContent = result.message;
        form.reset();
      } else {
        msg.style.color = 'red';
        msg.textContent = result.message || 'Something went wrong.';
      }
    } catch (error) {
      msg.style.color = 'red';
      msg.textContent = 'Submission failed.';
      console.error('Error:', error);
    }
  });
</script>
